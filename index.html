<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHT Sales Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <div class="container-fluid px-2">
        <div class="header">
            <div>LHT</div>
            <div>Sales Dashboard</div>
        </div>

        <div class="sub-header">
            Agent Performance<br />
            <small id="reportDate"></small>
        </div>

        <div class="row g-3 mt-3 px-2">
            <div class="col-6">
                <div class="card-metric">Calls Made<br /><strong id="callsMade"></strong></div>
            </div>
            <div class="col-6">
                <div class="card-metric">Calls Received<br /><strong id="callsReceived"></strong></div>
            </div>
            <div class="col-6">
                <div class="card-metric">Texts Sent<br /><strong id="textsSent"></strong></div>
            </div>
            <div class="col-6">
                <div class="card-metric">Texts Received<br /><strong id="textsReceived"></strong></div>
            </div>
        </div>
    </div>

    <script src="./assets/js/script.js"></script>
</body>
</html>
